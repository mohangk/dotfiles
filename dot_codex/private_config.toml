# Shared Codex configuration.
# Keep auth, project trust paths, marketplace cache paths, MCP server tokens,
# histories, and state DBs local.

model = "gpt-5.6-sol"
model_reasoning_effort = "medium"

[tui]
# Start the Codex TUI composer in Vim normal mode.
vim_mode = true

[plugins."github@openai-curated"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."sites@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."google-calendar@openai-curated"]
enabled = true

[plugins."slack@openai-curated"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

# Add future MCP servers here, for example:
# [mcp_servers.example]
# command = "example-mcp-server"
# args = ["--stdio"]
# Keep MCP servers whose URLs embed tokens (e.g. Home Assistant) out of this
# file; configure those locally with `codex mcp add`.
