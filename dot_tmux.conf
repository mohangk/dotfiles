# vim keybindings config
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection

# mouse support
setw -g mouse on

# Make mouse-wheel scrolling in tmux copy-mode less jumpy. This came from
# marmoset's local tmux config and is safe everywhere.
bind -T copy-mode-vi WheelUpPane send-keys -N 1 -X scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -N 1 -X scroll-down
bind -T copy-mode WheelUpPane send-keys -N 1 -X scroll-up
bind -T copy-mode WheelDownPane send-keys -N 1 -X scroll-down

# Let full-screen programs using the terminal alternate screen handle the wheel.
bind -n WheelUpPane if -F "#{alternate_on}" "send-keys -M" "if -F '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialise TMUX plugin manager. TPM is installed by run_once_after_10-install-tpm.sh.
if-shell '[ -x "$HOME/.tmux/plugins/tpm/tpm" ]' 'run "$HOME/.tmux/plugins/tpm/tpm"'
